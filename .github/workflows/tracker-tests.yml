name: Pulso tracker tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run first-party tracker unit tests
        run: node --test tests/pulso-tracker.test.mjs